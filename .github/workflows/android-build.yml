name: Android Build

on:
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          MAJOR=$(sed -n 's/^version\.major=//p' version.properties | tr -d '[:space:]')
          MINOR=$(sed -n 's/^version\.minor=//p' version.properties | tr -d '[:space:]')
          PATCH=$(sed -n 's/^version\.patch=//p' version.properties | tr -d '[:space:]')
          PR="${PR_NUMBER:-$GITHUB_RUN_NUMBER}"
          VERSION_NAME="${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}.$(printf '%05d' "$PR")"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          {
            echo "pr=$PR"
            echo "name=$VERSION_NAME"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION_NAME（PR #$PR）"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 官方 ubuntu runner 已预装 Android SDK，AGP 会自动补齐缺失的
      # platform / build-tools；不再使用 android-actions/setup-android（其许可证
      # 自动接受步骤与新版 cmdline-tools 不兼容）。
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: >
          ./gradlew
          :app:assembleDebug
          -PprNumber=${{ steps.version.outputs.pr }}
          -PbuildNumber=${{ steps.version.outputs.build_number }}
          -PgitSha=${{ github.sha }}
          -PbuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AMC-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo "## AMC ${{ steps.version.outputs.name }}"
            echo ""
            echo "- 类型：PR 验证构建（debug APK）"
            echo "- PR：#${{ steps.version.outputs.pr }}"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 产物：Actions Artifacts 中的 \`AMC-${{ steps.version.outputs.name }}-debug\`"
          } >> "$GITHUB_STEP_SUMMARY"
